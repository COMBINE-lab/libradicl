[package]
name = "libradicl"
version = "0.12.2"
authors.workspace = true
edition.workspace = true
description = "support library for alevin-fry"
license.workspace = true
readme = "../README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/libradicl"
include = ["src/*.rs", "examples/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = [
  "single-cell",
  "preprocessing",
  "RNA-seq",
  "ATAC-seq",
  "single-nucleus",
]
categories = ["command-line-utilities", "science"]

[dependencies]
libradicl-macros = { version = "0.12.2", path = "../libradicl-macros" }
snap = "1"
scroll = "0.13.0"
num = "0.4.3"
ahash = "0.8.12"
serde = { version = "1.0.228", features = ["derive"] }
dashmap = "^6.1.0"
bio-types = "1.0.4"
smallvec = "1.15.1"
anyhow = "1.0.102"
bincode = "1.3.3"
itertools = "0.14.0"
bytemuck = { version = "1.25.0", features = [
  "aarch64_simd",
  "extern_crate_alloc",
] }
derivative = "2.2.0"
crossbeam-queue = "0.3.12"
noodles = { version = "0.108.0", features = ["bam", "sam"] }

[dev-dependencies]
needletail = "0.6.3"
indicatif = "0.18.4"

[package]
name = "libradicl"
version = "0.15.0"
authors.workspace = true
edition.workspace = true
description = "support library for alevin-fry"
license.workspace = true
readme = "../README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/libradicl"
include = ["src/*.rs", "examples/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = [
  "single-cell",
  "preprocessing",
  "RNA-seq",
  "ATAC-seq",
  "single-nucleus",
]
categories = ["command-line-utilities", "science"]

[features]
default = []
# Enables zstd (codec id 2) for RAD chunk compression. Off by default so the
# crate stays pure-Rust (lz4, codec id 1, is always available via lz4_flex);
# zstd pulls in the C zstd-sys. Readers built without this feature can still
# read uncompressed and lz4 RAD files, and error clearly on a zstd chunk.
zstd = ["dep:zstd"]

[dependencies]
libradicl-macros = { version = "0.15.0", path = "../libradicl-macros" }
snap = "1"
lz4_flex = "0.14"
zstd = { version = "0.13", optional = true }
scroll = "0.13.0"
num = "0.4.3"
ahash = "0.8.12"
serde = { version = "1.0.228", features = ["derive"] }
dashmap = "^6.1.0"
bio-types = "1.0.4"
smallvec = "1.15.1"
anyhow = "1.0.102"
bincode = "1.3.3"
itertools = "0.15.0"
bytemuck = { version = "1.25.0", features = [
  "aarch64_simd",
  "extern_crate_alloc",
] }
educe = { version = "0.7.4", default-features = false, features = [
  "Debug",
  "PartialEq",
  "Eq",
] }
crossbeam-queue = "0.3.12"
crossbeam-utils = "0.8.22"
noodles = { version = "0.113.0", features = ["bam", "sam"] }

[dev-dependencies]
needletail = "0.7.3"
indicatif = "0.18.4"
